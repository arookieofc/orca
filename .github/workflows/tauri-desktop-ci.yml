name: Tauri Desktop CI

on:
  pull_request:
    paths:
      - 'tauri-poc/**'
      - 'src/renderer/**'
      - 'src/main/runtime/**'
      - 'src/shared/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  rust-and-bundles:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-14
            name: macos
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/install-mobile-dependencies
      - run: pnpm run verify:rpc-params-catalog
      - run: pnpm tc:node -- --compiler=native
      - run: pnpm tc:web -- --compiler=native
      - run: pnpm run build:web
      - run: pnpm run build:mobile-web
      - run: pnpm run build:orcad
      - run: cargo test --manifest-path tauri-poc/src-tauri/Cargo.toml
      - run: cargo check --manifest-path tauri-poc/src-tauri/Cargo.toml
